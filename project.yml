name: Jammanbo
options:
  xcodeVersion: "27.0"
  projectFormat: xcode27_0
  bundleIdPrefix: com.team17.jammanbo
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    DEVELOPMENT_TEAM: ""
targets:
  Jammanbo:
    type: application
    platform: iOS
    sources:
      - path: Jammanbo
      - path: Shared
    info:
      path: Jammanbo/Info.generated.plist
      properties:
        CFBundleDisplayName: 잠만보
        NSHealthShareUsageDescription: 수면 기록을 읽어 날짜별 수면 시간과 단계를 보여줍니다. 건강 데이터는 이 기기에 표시하기 위해서만 사용합니다.
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
    entitlements:
      path: Jammanbo/Jammanbo.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.team17.jammanbo
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: JammanboWatch
        embed: true
        link: false
      - sdk: PDFKit.framework
      - sdk: HealthKit.framework
      - sdk: WatchConnectivity.framework

  JammanboWatch:
    type: application
    platform: watchOS
    sources:
      - path: JammanboWatch
      - path: Shared
    info:
      path: JammanboWatch/Info.generated.plist
      properties:
        CFBundleDisplayName: 잠만보
        WKCompanionAppBundleIdentifier: com.team17.jammanbo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.team17.jammanbo.watchkitapp
        SKIP_INSTALL: YES
    dependencies:
      - sdk: WatchConnectivity.framework

schemes:
  Jammanbo:
    build:
      targets:
        Jammanbo: all
